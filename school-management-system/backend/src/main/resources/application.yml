spring:
  application:
    name: school-management-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: ${FILE_MAX_SIZE_MB:10}MB
      max-request-size: ${FILE_MAX_SIZE_MB:10}MB
  mvc:
    # Raise NoHandlerFoundException so GlobalExceptionHandler can answer 404
    # instead of letting unmatched routes fall through to the 500 catch-all.
    throw-exception-if-no-handler-found: true
  web:
    resources:
      # No static resources are served from the API; without this the resource
      # handler swallows unmatched paths before the exception can be raised.
      add-mappings: false
  datasource:
    hikari:
      # Long-lived local runs previously had no bounds here. Recycling below
      # PostgreSQL's own idle/session limits keeps the pool from handing out
      # a connection the server has already dropped.
      maximum-pool-size: ${DB_POOL_MAX:12}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 20000
      validation-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 900000
      keepalive-time: 120000
      leak-detection-threshold: 30000
      connection-test-query: SELECT 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 32
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  # Finish in-flight requests instead of cutting them off on stop.
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

app:
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}
  jwt:
    secret: ${JWT_SECRET}
    access-minutes: ${JWT_ACCESS_MINUTES:20}
    refresh-days: ${JWT_REFRESH_DAYS:7}
  files:
    storage-dir: ${FILE_STORAGE_DIR:./data/uploads}
    max-size-mb: ${FILE_MAX_SIZE_MB:10}
  payment:
    secret: ${PAYMENT_SECRET:dev-only-change-me}
    provider: ${PAYMENT_PROVIDER:mock}
  bootstrap:
    enabled: false
  seed:
    enabled: false
    volume: false

logging:
  level:
    root: INFO
    com.schoolgroup.sms: INFO
