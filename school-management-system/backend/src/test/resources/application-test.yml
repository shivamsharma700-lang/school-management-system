spring:
  datasource:
    url: jdbc:h2:mem:sms_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/testdata

app:
  jwt:
    secret: test-only-jwt-secret-not-for-production-use-must-be-long-enough-64
  seed:
    enabled: true
    volume: false
  cors:
    origins: http://localhost:5173
  payment:
    secret: test-payment-secret
    provider: mock
